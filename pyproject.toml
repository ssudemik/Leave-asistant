[project]
name = "leave-assistant"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
